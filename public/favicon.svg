<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FF4D" stop-opacity="1" />
      <stop offset="100%" stop-color="#80EE10" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Subtle Inner Accent Border -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#D1FF4D" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Monogram UM stylized -->
  <g fill="none" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- U -->
    <path d="M 16 19 L 16 35 C 16 41 22 43 27 43 C 32 43 33 40 33 36 L 33 22" />
    <!-- M -->
    <path d="M 36 43 L 36 21 L 44 32 L 52 21 L 52 43" stroke="#FFFFFF" />
  </g>

  <!-- Accent dot -->
  <circle cx="27" cy="21" r="2" fill="#D1FF4D" filter="url(#softGlow)" />
</svg>
